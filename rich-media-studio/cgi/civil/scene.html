<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<style>
    @font-face { font-family: 'BrandFont'; src: url('../../assets/nunito-900.woff2') format('woff2'); font-weight: 900;
        unicode-range: U+0000-00FF, U+0131, U+2000-206F, U+20AC; }
    @font-face { font-family: 'BrandFont'; src: url('../../assets/nunito-900-ext.woff2') format('woff2'); font-weight: 900;
        unicode-range: U+0100-02AF; }
    html, body { margin: 0; background: transparent; overflow: hidden; }
    #stage { position: relative; width: 970px; height: 250px; font-family: 'BrandFont', Arial, sans-serif; font-weight: 900; }

    /* Panel: sahnenin "çerçevesi". Ürünler bunun dışına taşar. */
    #panel {
        position: absolute; left: 22px; top: 58px; width: 926px; height: 162px;
        border-radius: 26px; overflow: hidden;
        background: radial-gradient(ellipse 60% 120% at 62% 30%, #ffb347 0%, #ff7a1e 38%, #f04e23 70%, #d81f26 100%);
        box-shadow: inset 0 0 0 3px rgba(255,255,255,0.85), inset 0 -18px 30px rgba(120,0,0,0.25), 0 10px 24px rgba(120,20,0,0.35);
        transform-origin: 50% 50%;
    }
    #floor { position: absolute; left: 0; right: 0; bottom: 0; height: 46px;
        background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.18) 100%); }
    .far { position: absolute; bottom: 30px; filter: blur(0.9px) saturate(0.85); opacity: 0.5; transform-origin: 50% 100%; }
    .spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px 2px rgba(255,255,255,0.8); }
    #sweep { position: absolute; top: -40px; width: 120px; height: 260px; transform: rotate(18deg);
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.45) 50%, rgba(255,255,255,0) 100%); }
    #burst { position: absolute; left: 0; top: 0; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 50%;
        background: repeating-conic-gradient(rgba(255,255,255,0.22) 0deg 9deg, rgba(255,255,255,0) 9deg 22deg);
        -webkit-mask: radial-gradient(circle, #000 0%, #000 30%, transparent 70%); mask: radial-gradient(circle, #000 0%, #000 30%, transparent 70%); }

    /* Yakın katman: panel dışına taşabilir */
    #near { position: absolute; inset: 0; perspective: 900px; }
    .prod { position: absolute; transform-origin: 50% 100%; will-change: transform; }
    .prod img { display: block; width: 100%; height: 100%; filter: drop-shadow(0 6px 8px rgba(80,10,0,0.35)); }
    .shadow { position: absolute; height: 14px; border-radius: 50%; background: radial-gradient(ellipse, rgba(70,0,0,0.45) 0%, rgba(70,0,0,0) 70%); }
    .tag { position: absolute; padding: 5px 12px 6px; border-radius: 999px; background: #fff; color: #e5262b; font-size: 19px;
        white-space: nowrap; box-shadow: 0 4px 10px rgba(90,10,0,0.35); transform-origin: 0 100%; }
    .tag small { font-size: 12px; margin-left: 2px; }

    #logo { position: absolute; left: 34px; bottom: 26px; width: 200px; transform-origin: 50% 100%; }
    #logo img { width: 100%; display: block; filter: drop-shadow(0 8px 10px rgba(80,10,0,0.4)); }

    #tagline { position: absolute; left: 262px; top: 38px; color: #fff; }
    #tagline .k { font-size: 14px; letter-spacing: 2px; opacity: 0.9; }
    #tagline .h { font-size: 38px; line-height: 1.02; text-shadow: 0 3px 10px rgba(120,0,0,0.3); }

    #endcopy { position: absolute; left: 712px; top: 16px; color: #fff; width: 210px; }
    #endcopy .d { font-size: 15px; letter-spacing: 1.5px; opacity: 0.95; }
    #endcopy .h { font-size: 30px; line-height: 1.02; margin: 4px 0 12px; text-shadow: 0 3px 10px rgba(120,0,0,0.3); }
    #cta { display: inline-block; background: #fff; color: #e5262b; font-size: 17px; padding: 9px 20px 10px; border-radius: 999px;
        box-shadow: 0 5px 14px rgba(90,10,0,0.4); transform-origin: 0 50%; }

    .conf { position: absolute; width: 8px; height: 12px; border-radius: 2px; }
</style>
</head>
<body>
<div id="stage">
    <div id="panel">
        <div id="burst"></div>
        <div id="farLayer"></div>
        <div id="sparks"></div>
        <div id="floor"></div>
        <div id="sweep"></div>
        <div id="tagline"><div class="k">30. YILA ÖZEL</div><div class="h">Fırsatlar<br>yola çıktı!</div></div>
        <div id="endcopy"><div class="d">02–15 KASIM</div><div class="h">30. Yıl<br>Fırsatları</div><div id="cta">Hemen Keşfet ›</div></div>
    </div>
    <div id="near"></div>
    <div id="logo"><img src="prod/logo.png"></div>
    <div id="confetti"></div>
</div>

<script>
// ---------- yardımcılar ----------
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function prog(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function backOut(x) { var c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
function spring(x) { return x <= 0 ? 0 : 1 - Math.exp(-6 * x) * Math.cos(11 * x); }
var seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

// ---------- sahne verisi ----------
var FLOOR = 222;              // yakın katman zemin çizgisi (panel altı ~220)
var NEAR = [
    { img: 'molfix',   h: 162, price: '250',    t0: 0.9 },
    { img: 'cars',     h: 180, price: '750',    t0: 2.15 },
    { img: 'carseat',  h: 200, price: '9.990',  t0: 3.4 },
    { img: 'pacifier', h: 140, price: '400',    t0: 4.65 },
    { img: 'playpen',  h: 186, price: '4.900',  t0: 5.9 }
];
var HERO = { img: 'stroller2', h: 214, price: '18.990', t0: 7.3, stopX: 560, tStop: 9.0 };
var FAR = [
    { img: 'bag', h: 70 }, { img: 'stroller', h: 84 }, { img: 'carseat', h: 78 }, { img: 'molfix', h: 60 }, { img: 'cars', h: 72 }, { img: 'playpen', h: 70 }
];
var RATIO = {};
var TRAVEL = 3.7;             // yakın ürünün ekranı geçme süresi (sn)
var X_IN = 1110, X_OUT = 120; // giriş ve çıkış merkez x

var near = document.getElementById('near');
function mk(item, withTag) {
    var sh = document.createElement('div'); sh.className = 'shadow'; near.appendChild(sh);
    var d = document.createElement('div'); d.className = 'prod';
    d.innerHTML = '<img src="prod/' + item.img + '.png">'; near.appendChild(d);
    var tag = null;
    if (withTag) { tag = document.createElement('div'); tag.className = 'tag'; tag.innerHTML = item.price + '<small> TL</small>'; near.appendChild(tag); }
    item.el = d; item.sh = sh; item.tag = tag;
}
NEAR.forEach(function (n) { mk(n, true); });
mk(HERO, true);

var farLayer = document.getElementById('farLayer');
FAR.forEach(function (f, i) {
    var d = document.createElement('div'); d.className = 'far';
    d.innerHTML = '<img src="prod/' + f.img + '.png" style="height:' + f.h + 'px;display:block">';
    farLayer.appendChild(d); f.el = d; f.x0 = 120 + i * 175;
});
var sparks = [];
for (var i = 0; i < 26; i++) {
    var s = document.createElement('div'); s.className = 'spark';
    document.getElementById('sparks').appendChild(s);
    sparks.push({ el: s, x0: rnd() * 1000, y: 8 + rnd() * 120, sp: 40 + rnd() * 120, sz: 0.4 + rnd() * 0.9, ph: rnd() * 6 });
}
var conf = [], colors = ['#ffd34d', '#ffffff', '#2bb673', '#3aa0ff', '#ff4fa3', '#ffe38a'];
for (var i = 0; i < 46; i++) {
    var c = document.createElement('div'); c.className = 'conf'; c.style.background = colors[i % colors.length];
    document.getElementById('confetti').appendChild(c);
    var ang = -Math.PI / 2 + (rnd() - 0.5) * 2.6;
    conf.push({ el: c, vx: Math.cos(ang) * (160 + rnd() * 260), vy: Math.sin(ang) * (170 + rnd() * 220), rot: rnd() * 720, d: rnd() * 0.25 });
}

function placeProd(item, cx, scale, rotY, alpha, t) {
    var r = RATIO[item.img] || 1, h = item.h * scale, w = h * r;
    item.el.style.width = w + 'px'; item.el.style.height = h + 'px';
    item.el.style.left = (cx - w / 2) + 'px'; item.el.style.top = (FLOOR - h) + 'px';
    item.el.style.transform = 'rotateY(' + rotY + 'deg)';
    item.el.style.opacity = alpha;
    item.sh.style.width = (w * 0.95) + 'px'; item.sh.style.left = (cx - w * 0.475) + 'px'; item.sh.style.top = (FLOOR - 8) + 'px';
    item.sh.style.opacity = alpha;
    return { w: w, h: h };
}

// ---------- tek kare çiz ----------
function render(t) {
    // Panel girişi
    var pIn = prog(t, 0, 0.75);
    var panel = document.getElementById('panel');
    panel.style.transform = 'scaleX(' + lerp(0.05, 1, backOut(pIn)) + ') scaleY(' + lerp(0.3, 1, easeOut(pIn)) + ')';
    panel.style.opacity = clamp(pIn * 3, 0, 1);

    // Işık süpürmesi (açılışta ve kapanışta)
    var sw = document.getElementById('sweep');
    var s1 = prog(t, 0.5, 1.4), s2 = prog(t, 9.0, 9.9);
    var sp = s2 > 0 ? s2 : s1;
    sw.style.left = lerp(-200, 1050, easeInOut(sp)) + 'px';
    sw.style.opacity = (sp > 0 && sp < 1) ? 1 : 0;

    // Logo: yukarıdan zıplayarak gelir, hafif nefes alır
    var lIn = prog(t, 0.35, 1.25);
    var logo = document.getElementById('logo');
    var breathe = 1 + 0.025 * Math.sin(t * 3.2);
    logo.style.transform = 'translateY(' + lerp(-260, 0, spring(lIn)) + 'px) scale(' + (lIn > 0 ? breathe : 0.6) + ') rotate(' + (Math.sin(t * 2.1) * 1.8) + 'deg)';
    logo.style.opacity = lIn > 0 ? 1 : 0;

    // Slogan
    var tg = document.getElementById('tagline');
    var tIn = prog(t, 1.0, 1.6), tOut = prog(t, 2.55, 3.0);
    tg.style.opacity = tIn * (1 - tOut);
    tg.style.transform = 'translateX(' + (lerp(30, 0, easeOut(tIn)) - tOut * 60) + 'px)';

    // Uzak katman (paralaks, yavaş)
    FAR.forEach(function (f) {
        var x = ((f.x0 - t * 70) % 1050 + 1050) % 1050 - 90;
        f.el.style.left = x + 'px';
        f.el.style.opacity = 0.45 * clamp(prog(t, 0.6, 1.4), 0, 1) * (1 - prog(t, 8.6, 9.3));
    });

    // Işıltılar
    sparks.forEach(function (s) {
        var x = ((s.x0 - t * s.sp) % 1000 + 1000) % 1000 - 30;
        s.el.style.left = x + 'px'; s.el.style.top = s.y + 'px';
        s.el.style.transform = 'scale(' + (s.sz * (0.6 + 0.4 * Math.sin(t * 4 + s.ph))) + ')';
        s.el.style.opacity = prog(t, 0.6, 1.2) * 0.85;
    });

    // Yakın katman: sağdan sola sinematik akış
    NEAR.forEach(function (n) {
        var p = (t - n.t0) / TRAVEL;
        if (p < 0 || p > 1) { n.el.style.opacity = 0; n.sh.style.opacity = 0; n.tag.style.opacity = 0; return; }
        var x = lerp(X_IN, X_OUT, p);                                     // sabit hızlı kamera kaydırması
        var focus = Math.exp(-Math.pow((x - 600) / 210, 2));               // ortaya gelince kameraya yaklaşır
        var scale = 0.86 + 0.22 * focus;
        var rot = clamp((x - 600) / 600, -1, 1) * -24;
        var fade = clamp((x - X_OUT) / 140, 0, 1);                          // logonun arkasına girerken söner
        var b = placeProd(n, x, scale, rot, fade, t);
        // fiyat etiketi: ortadayken açılır
        var tagS = clamp(focus * 1.6 - 0.35, 0, 1);
        n.tag.style.left = (x + b.w * 0.18) + 'px';
        n.tag.style.top = (FLOOR - b.h - 4) + 'px';
        n.tag.style.transform = 'scale(' + backOut(tagS) + ') rotate(-6deg)';
        n.tag.style.opacity = tagS > 0.02 ? fade : 0;
    });

    // Kahraman ürün: sağdan gelir, ortada durur, büyür ve çerçeveden taşar
    var hp = prog(t, HERO.t0, HERO.tStop);
    if (t < HERO.t0) { HERO.el.style.opacity = 0; HERO.sh.style.opacity = 0; HERO.tag.style.opacity = 0; }
    else {
        var hx = lerp(X_IN + 40, HERO.stopX, easeOut(hp));
        var settle = spring(prog(t, HERO.tStop - 0.35, HERO.tStop + 0.9));
        var hs = lerp(0.85, 1, settle) * (1 + 0.012 * Math.sin(t * 3));
        var hr = lerp(-28, 0, easeOut(hp)) + Math.sin(t * 1.6) * 2.5 * settle;
        var hb = placeProd(HERO, hx, hs, hr, 1, t);
        var ht = backOut(prog(t, 9.15, 9.6));
        HERO.tag.style.left = (hx + hb.w * 0.2) + 'px';
        HERO.tag.style.top = (FLOOR - hb.h - 2) + 'px';
        HERO.tag.style.transform = 'scale(' + ht + ') rotate(-6deg)';
        HERO.tag.style.opacity = ht > 0.02 ? 1 : 0;
    }
    // Kahramanın arkasında ışık patlaması
    var bu = document.getElementById('burst');
    var bIn = prog(t, 8.7, 9.4);
    bu.style.left = (HERO.stopX - 22) + 'px'; bu.style.top = '110px';
    bu.style.opacity = easeOut(bIn) * 0.9;
    bu.style.transform = 'scale(' + lerp(0.4, 1, easeOut(bIn)) + ') rotate(' + (t * 14) + 'deg)';

    // Kapanış metni + CTA
    var ec = document.getElementById('endcopy');
    var eIn = prog(t, 9.3, 9.9);
    ec.style.opacity = eIn;
    ec.style.transform = 'translateX(' + lerp(40, 0, easeOut(eIn)) + 'px)';
    var pulse = t > 10.2 ? 1 + 0.06 * Math.max(0, Math.sin((t - 10.2) * 5)) : 1;
    document.getElementById('cta').style.transform = 'scale(' + (backOut(prog(t, 9.6, 10.1)) * pulse) + ')';

    // Konfeti (kahraman durunca)
    var ct = t - 9.05;
    conf.forEach(function (c) {
        var tt = ct - c.d;
        if (tt < 0 || tt > 2.6) { c.el.style.opacity = 0; return; }
        var x = HERO.stopX + c.vx * tt, y = 120 + c.vy * tt + 330 * tt * tt;
        c.el.style.left = x + 'px'; c.el.style.top = y + 'px';
        c.el.style.transform = 'rotate(' + (c.rot + tt * 600) + 'deg)';
        c.el.style.opacity = clamp(1 - tt / 2.6, 0, 1);
    });
}

window.ready = Promise.all(Array.prototype.map.call(document.images, function (im) {
    return im.complete ? Promise.resolve() : new Promise(function (r) { im.onload = r; im.onerror = r; });
})).then(function () {
    ['molfix', 'cars', 'carseat', 'pacifier', 'playpen', 'stroller2'].forEach(function (k) {
        var im = document.querySelector('.prod img[src="prod/' + k + '.png"]');
        RATIO[k] = im.naturalWidth / im.naturalHeight;
    });
    return document.fonts.ready;
}).then(function () { render(0); return true; });
</script>
</body>
</html>
