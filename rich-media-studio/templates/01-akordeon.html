<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.size" content="width=970,height=250">
    <title>Akordeon Masthead 970x250</title>
    <!-- NEEDS: b1.jpg b2.jpg b3.jpg b4.jpg b5.jpg b6.jpg -->
    <style>
/*HEAD*/
        #ad {
            position: relative;
            width: 970px;
            height: 250px;
            overflow: hidden;
            background: var(--paper);
            cursor: pointer;
        }
        .panels { display: flex; width: 970px; height: 250px; }

        .panel {
            position: relative;
            flex: 0 0 100px;
            height: 250px;
            overflow: hidden;
            border-right: 2px solid #fff;
            transition: flex-basis 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .panel:last-child { border-right: 0; }
        .panel.open { flex-basis: 470px; }

        /* Kapalı panel yüzü */
        .face {
            position: absolute;
            inset: 0;
            width: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0 18px;
            color: #fff;
            background: linear-gradient(180deg, var(--brand3) 0%, var(--brand) 55%, var(--brand2) 100%);
            transition: opacity 0.3s ease;
        }
        .panel:nth-child(even) .face {
            background: linear-gradient(180deg, var(--brand) 0%, var(--brand2) 100%);
        }
        .face .num {
            width: 34px; height: 34px;
            border-radius: 50%;
            background: rgba(255,255,255,0.22);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .face .vname {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 17px;
            line-height: 1;
            white-space: nowrap;
            max-height: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .face .vprice {
            font-size: 12px;
            color: var(--brand2);
            background: #fff;
            border-radius: 999px;
            padding: 4px 8px;
            white-space: nowrap;
        }

        /* Açık panel içeriği */
        .content {
            position: absolute;
            inset: 0;
            width: 470px;
            display: flex;
            align-items: center;
            background: var(--soft);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease 0.15s;
        }
        .panel.open .face { opacity: 0; }
        .panel.open .content { opacity: 1; pointer-events: auto; }
        .content img { width: 300px; height: 250px; display: block; flex: 0 0 300px; }
        .info {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            padding: 0 14px 0 16px;
        }
        .info .label { font-size: 11px; letter-spacing: 1px; color: var(--brand); }
        .info .name { font-size: 16px; line-height: 1.15; color: var(--ink); }
        .info .price { font-size: 24px; color: var(--brand2); }
        .info .btn { font-size: 13px; padding: 8px 14px; margin-top: 4px; }

        /* İlerleme çubuğu (otomatik geçiş göstergesi) */
        .bar {
            position: absolute;
            left: 0; bottom: 0;
            height: 4px;
            width: 0;
            background: var(--brand2);
            z-index: 5;
        }
        .bar.run { width: 100%; transition: width linear; }
    </style>
    <script type="text/javascript">
/*CONFIG*/
    </script>
</head>
<body>
    <div id="ad" onclick="exitClick(event)">
        <div class="panels" id="panels"></div>
    </div>

    <script type="text/javascript">
        var COUNT = 6;          // Akordeonda gösterilecek ürün sayısı (6 panel = 970px)
        var AUTO_MS = 2800;     // Otomatik geçiş süresi

        var list = PRODUCTS.slice(0, COUNT);
        var panelsEl = document.getElementById('panels');
        var current = 0, timer = null, resumeTimer = null;

        list.forEach(function (p, i) {
            var el = document.createElement('div');
            el.className = 'panel';
            el.innerHTML =
                '<div class="face"><div class="num">' + (i + 1) + '</div>' +
                '<div class="vname">' + p.short + '</div>' +
                '<div class="vprice">' + p.price + '</div></div>' +
                '<div class="content"><img src="' + p.b + '" alt="' + p.name + '">' +
                '<div class="info"><div class="label">30. YIL FIRSATI</div>' +
                '<div class="name">' + p.name + '</div>' +
                '<div class="price">' + p.price + '</div>' +
                '<button class="btn">Hemen İncele ›</button></div></div>';
            el.addEventListener('mouseenter', function () { open(i); stopAuto(); });
            el.addEventListener('click', function (e) {
                e.stopPropagation();
                if (current === i) productClick(i, e);  // Açık panel: ürüne git
                else { open(i); stopAuto(); scheduleResume(); } // Kapalı panel (mobil ilk dokunuş): aç
            });
            panelsEl.appendChild(el);
        });

        var bar = document.createElement('div');
        bar.className = 'bar';
        document.getElementById('ad').appendChild(bar);

        function open(i) {
            current = i;
            var ps = panelsEl.children;
            for (var k = 0; k < ps.length; k++) ps[k].className = 'panel' + (k === i ? ' open' : '');
        }
        function runBar() {
            bar.className = 'bar';
            bar.style.transitionDuration = '0ms';
            bar.offsetWidth;
            bar.style.transitionDuration = AUTO_MS + 'ms';
            bar.className = 'bar run';
        }
        function startAuto() {
            stopAuto();
            runBar();
            timer = setInterval(function () { open((current + 1) % list.length); runBar(); }, AUTO_MS);
        }
        function stopAuto() {
            clearInterval(timer); timer = null;
            bar.className = 'bar';
        }
        function scheduleResume() {
            clearTimeout(resumeTimer);
            resumeTimer = setTimeout(startAuto, 5000);
        }
        document.getElementById('ad').addEventListener('mouseleave', scheduleResume);

        open(0);
        startAuto();
    </script>
</body>
</html>
