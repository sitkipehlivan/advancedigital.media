<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.size" content="width=970,height=250">
    <title>Kazı Kazan Masthead 970x250</title>
    <!-- NEEDS: w1.jpg w2.jpg w3.jpg w4.jpg w5.jpg w6.jpg w7.jpg w8.jpg w9.jpg -->
    <style>
/*HEAD*/
        #ad {
            position: relative;
            width: 970px;
            height: 250px;
            overflow: hidden;
            background: var(--paper);
        }
        #prize {
            position: absolute;
            inset: 0;
            width: 970px;
            height: 250px;
            display: block;
            cursor: pointer;
        }
        #cover {
            position: absolute;
            inset: 0;
            width: 970px;
            height: 250px;
            touch-action: none;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><circle cx='20' cy='20' r='17' fill='%23ffd34d' stroke='%23b8860b' stroke-width='3'/><text x='20' y='26' font-size='16' text-anchor='middle' fill='%23b8860b' font-family='Arial' font-weight='bold'>₺</text></svg>") 20 20, pointer;
            transition: opacity 0.6s ease;
            z-index: 3;
        }
        #cover.gone { opacity: 0; pointer-events: none; }

        /* Kazıma ipucu: zikzak çizen bozuk para */
        .coin {
            position: absolute;
            left: 600px; top: 100px;
            width: 40px; height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff3b0, #ffd34d 45%, #d9a300);
            border: 3px solid #b8860b;
            color: #8a6400;
            font: 900 17px Arial, sans-serif;
            display: flex; align-items: center; justify-content: center;
            z-index: 4;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            animation: coinHint 2.2s ease-in-out infinite;
        }
        .coin.gone { display: none; }
        @keyframes coinHint {
            0%   { transform: translate(0, 0) rotate(0deg); }
            25%  { transform: translate(90px, -40px) rotate(20deg); }
            50%  { transform: translate(180px, 10px) rotate(-10deg); }
            75%  { transform: translate(90px, 50px) rotate(15deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .cta {
            position: absolute;
            right: 52px;
            bottom: 10px;
            font-size: 14px;
            padding: 8px 18px;
            z-index: 5;
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: opacity 0.4s ease 0.3s, transform 0.4s ease 0.3s;
        }
        .cta.show { opacity: 1; transform: translateY(0); pointer-events: auto; animation: pulse 1.6s ease-in-out 1s infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

        .confetti {
            position: absolute;
            top: -12px;
            width: 8px; height: 12px;
            z-index: 6;
            pointer-events: none;
            animation: fall linear forwards;
        }
        @keyframes fall { to { transform: translateY(280px) rotate(540deg); opacity: 0.2; } }
    </style>
    <script type="text/javascript">
/*CONFIG*/
    </script>
</head>
<body>
    <div id="ad">
        <img id="prize" alt="">
        <canvas id="cover" width="970" height="250"></canvas>
        <div class="coin" id="coin">₺</div>
        <button class="btn cta" id="cta">Fırsatı Yakala ›</button>
    </div>

    <script type="text/javascript">
        var REVEAL_AT = 0.42;    // Yüzde kaçı kazınınca kart açılsın
        var BRUSH = 48;          // Kazıma fırçası çapı (px)
        var HEADLINE = 'KAZI, KAZAN!';
        var SUBLINE = '30. Yıl\'a özel fırsatın bu kartın altında';

        var prizeIndex = Math.floor(Math.random() * PRODUCTS.length);
        var prize = document.getElementById('prize');
        var cover = document.getElementById('cover');
        var coin = document.getElementById('coin');
        var cta = document.getElementById('cta');
        var ctx = cover.getContext('2d');
        var revealed = false, lastX = null, lastY = null, moves = 0;

        prize.src = PRODUCTS[prizeIndex].w;
        prize.alt = PRODUCTS[prizeIndex].name;
        prize.addEventListener('click', function (e) { if (revealed) productClick(prizeIndex, e); });
        cta.addEventListener('click', function (e) { productClick(prizeIndex, e); });

        function paintCover() {
            ctx.globalCompositeOperation = 'source-over';
            var g = ctx.createLinearGradient(0, 0, 970, 250);
            var css = getComputedStyle(document.documentElement);
            g.addColorStop(0, css.getPropertyValue('--brand3').trim());
            g.addColorStop(0.55, css.getPropertyValue('--brand').trim());
            g.addColorStop(1, css.getPropertyValue('--brand2').trim());
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 970, 250);

            // Kazı kazan bileti dokusu: ince çapraz çizgiler
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 10;
            for (var x = -250; x < 970; x += 28) {
                ctx.beginPath(); ctx.moveTo(x, 250); ctx.lineTo(x + 250, 0); ctx.stroke();
            }
            // Gümüş kazıma alanı
            var sx = 520, sy = 34, sw = 410, sh = 182;
            var sg = ctx.createLinearGradient(sx, sy, sx + sw, sy + sh);
            sg.addColorStop(0, '#e9e9ee'); sg.addColorStop(0.5, '#bfc0c8'); sg.addColorStop(1, '#e2e2e8');
            ctx.fillStyle = sg;
            roundRect(sx, sy, sw, sh, 18); ctx.fill();
            ctx.setLineDash([8, 7]); ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff';
            roundRect(sx + 8, sy + 8, sw - 16, sh - 16, 12); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = '#8b8c96';
            ctx.font = '900 22px BrandFont, Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('BURAYI KAZI', sx + sw / 2, sy + sh / 2 + 8);

            // Başlıklar
            ctx.textAlign = 'left';
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 54px BrandFont, Arial, sans-serif';
            ctx.fillText(HEADLINE, 48, 118);
            ctx.font = '900 18px BrandFont, Arial, sans-serif';
            ctx.fillText(SUBLINE, 50, 152);
            ctx.font = '900 13px BrandFont, Arial, sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.fillText('Fareyi ya da parmağını kartın üzerinde gezdir', 50, 182);
        }
        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
        }

        function scratch(x, y) {
            if (revealed) return;
            coin.className = 'coin gone';
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.lineWidth = BRUSH;
            ctx.beginPath();
            ctx.moveTo(lastX === null ? x : lastX, lastY === null ? y : lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            lastX = x; lastY = y;
            if (++moves % 12 === 0) checkProgress();
        }
        function checkProgress() {
            var data = ctx.getImageData(0, 0, 970, 250).data, clear = 0, total = 0;
            for (var i = 3; i < data.length; i += 4 * 24) { total++; if (data[i] < 40) clear++; }
            if (clear / total >= REVEAL_AT) reveal();
        }
        function reveal() {
            if (revealed) return;
            revealed = true;
            cover.className = 'gone';
            cta.className = 'btn cta show';
            confetti();
        }
        function confetti() {
            var colors = ['#ffd34d', '#ffffff', '#e5262b', '#ff8a1e', '#2bb673', '#3aa0ff'];
            for (var i = 0; i < 46; i++) {
                var c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 970 + 'px';
                c.style.background = colors[i % colors.length];
                c.style.animationDuration = (1.4 + Math.random() * 1.4) + 's';
                c.style.animationDelay = (Math.random() * 0.4) + 's';
                document.getElementById('ad').appendChild(c);
                setTimeout(function (el) { el.remove(); }.bind(null, c), 3400);
            }
        }

        function pos(e) {
            var r = cover.getBoundingClientRect();
            return { x: (e.clientX - r.left) * (970 / r.width), y: (e.clientY - r.top) * (250 / r.height) };
        }
        // Masaüstünde fareyi gezdirmek yeterli, mobilde parmakla kazınır
        cover.addEventListener('pointermove', function (e) { var p = pos(e); scratch(p.x, p.y); });
        cover.addEventListener('pointerdown', function (e) { var p = pos(e); lastX = p.x; lastY = p.y; scratch(p.x, p.y); });
        cover.addEventListener('pointerleave', function () { lastX = lastY = null; });

        var ready = document.fonts && document.fonts.load ? document.fonts.load('900 20px BrandFont') : Promise.resolve();
        Promise.race([ready, new Promise(function (r) { setTimeout(r, 800); })]).then(function () { if (!moves) paintCover(); });
        paintCover();
    </script>
</body>
</html>
