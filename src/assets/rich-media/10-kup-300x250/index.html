<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.size" content="width=300,height=250">
    <title>3D Küp 300x250</title>
    <!-- NEEDS: ../_ortak/b1.jpg ../_ortak/b2.jpg ../_ortak/b3.jpg ../_ortak/b4.jpg ../_ortak/b5.jpg ../_ortak/b6.jpg ../_ortak/b7.jpg ../_ortak/b8.jpg ../_ortak/b9.jpg -->
    <style>

        /* ===== Marka ayarları: başka markaya uyarlarken sadece burayı değiştirin ===== */
        :root {
            --brand: #f15a22;      /* ana renk */
            --brand2: #e5262b;     /* koyu ton */
            --brand3: #ff8a1e;     /* açık ton */
            --ink: #3b1d12;        /* metin */
            --paper: #ffffff;      /* zemin */
            --soft: #fff4ec;       /* yumuşak zemin */
        }
        @font-face {
            font-family: 'BrandFont';
            src: url('../_ortak/nunito-900.woff2') format('woff2');
            font-weight: 900;
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'BrandFont';
            src: url('../_ortak/nunito-900-ext.woff2') format('woff2');
            font-weight: 900;
            unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { margin: 0; overflow: hidden; background: transparent; }
        body {
            font-family: 'BrandFont', 'Arial Rounded MT Bold', Arial, sans-serif;
            font-weight: 900;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn {
            background: linear-gradient(135deg, var(--brand3) 0%, var(--brand) 55%, var(--brand2) 100%);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 999px;
            font: inherit;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(180, 40, 0, 0.35);
            transition: transform 0.2s ease;
        }
        .btn:hover { transform: scale(1.05); }

        #ad { position: relative; width: 300px; height: 250px; overflow: hidden; background: var(--paper); cursor: grab; perspective: 760px; }
        #ad.drag { cursor: grabbing; }
        .prism {
            position: absolute; left: 0; top: 0; width: 300px; height: 250px;
            transform-style: preserve-3d;
            transition: transform 0.9s cubic-bezier(0.5, 0, 0.2, 1);
        }
        .prism.nodrag { transition: none; }
        .face {
            position: absolute; left: 0; top: 0; width: 300px; height: 250px;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            background: #fff;
        }
        .face img { width: 300px; height: 250px; display: block; pointer-events: none; }
        .face::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,0.18), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.18)); opacity: var(--shade, 0); transition: opacity 0.9s; pointer-events: none; }
        .hint {
            position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
            background: rgba(229, 38, 43, 0.92); color: #fff;
            font-size: 11px; padding: 5px 10px; border-radius: 999px; white-space: nowrap;
            box-shadow: 0 3px 8px rgba(0,0,0,0.25); pointer-events: none;
            transition: opacity 0.4s; z-index: 5;
        }
        .hint.gone { opacity: 0; }
    </style>
    <script type="text/javascript">

        /* ===== ClickTag tanımları: her ürün kendi clickTag'ine gider ===== */
        var clickTag  = "https://www.civilim.com";
        var clickTag1 = "https://www.civilim.com";
        var clickTag2 = "https://www.civilim.com";
        var clickTag3 = "https://www.civilim.com";
        var clickTag4 = "https://www.civilim.com";
        var clickTag5 = "https://www.civilim.com";
        var clickTag6 = "https://www.civilim.com";
        var clickTag7 = "https://www.civilim.com";
        var clickTag8 = "https://www.civilim.com";
        var clickTag9 = "https://www.civilim.com";

        /* ===== Ürün listesi: b = 300x250 banner, w = 970x250 banner ===== */
        var PRODUCTS = [
            { name: "Molfix Bebek Bezi",            short: "Bebek Bezi",  price: "250 TL",       b: "../_ortak/b1.jpg", w: "w1.jpg" },
            { name: "Konuşan Bebek & Araba",        short: "Oyuncak",     price: "550 TL'den",   b: "../_ortak/b2.jpg", w: "w2.jpg" },
            { name: "Panduf & Eşofman Takımı",      short: "Panduf",      price: "150 TL'den",   b: "../_ortak/b3.jpg", w: "w3.jpg" },
            { name: "Philips Avent Emzik & Biberon",short: "Emzik",       price: "400 TL'den",   b: "../_ortak/b4.jpg", w: "w4.jpg" },
            { name: "Eşofman & Spor Ayakkabı",      short: "Eşofman",     price: "650 TL'den",   b: "../_ortak/b5.jpg", w: "w5.jpg" },
            { name: "Oyun Parkı & Bebek Arabası",   short: "Oyun Parkı",  price: "4.900 TL'den", b: "../_ortak/b6.jpg", w: "w6.jpg" },
            { name: "Oto Koltuğu & Bebek Arabası",  short: "Oto Koltuğu", price: "9.990 TL'den", b: "../_ortak/b7.jpg", w: "w7.jpg" },
            { name: "Pijama & Panduf",              short: "Pijama",      price: "390 TL",       b: "../_ortak/b8.jpg", w: "w8.jpg" },
            { name: "Zıbın Seti & Bakım Çantası",   short: "Zıbın Seti",  price: "790 TL",       b: "../_ortak/b9.jpg", w: "w9.jpg" }
        ];

        function exitClick(e) {
            if (e) e.stopPropagation();
            window.open(clickTag, '_blank');
        }
        function productClick(i, e) {
            if (e) e.stopPropagation();
            window.open(window['clickTag' + (i + 1)] || clickTag, '_blank');
        }

    </script>
</head>
<body>
    <div id="ad" onclick="exitClick(event)">
        <div class="prism" id="prism"></div>
        <div class="hint" id="hint">‹ Sürükle, çevir ›</div>
    </div>

    <script type="text/javascript">
        var AUTO_MS = 2400;     // Otomatik dönüş aralığı
        var DEPTH = 150;        // Prizma derinliği (genişliğin yarısı)
        var prism = document.getElementById('prism');
        var faces = [];
        for (var i = 0; i < 4; i++) {
            var f = document.createElement('div');
            f.className = 'face';
            f.style.transform = 'rotateY(' + (i * 90) + 'deg) translateZ(' + DEPTH + 'px)';
            f.innerHTML = '<img alt="">';
            prism.appendChild(f);
            faces.push(f);
        }
        var step = 0;              // kaçıncı dönüşteyiz (sınırsız artar)
        var slot = [0, 1, 2, 3];   // her yüzde hangi ürün var

        function setFace(faceIdx, productIdx) {
            slot[faceIdx] = productIdx;
            var im = faces[faceIdx].querySelector('img');
            im.src = PRODUCTS[productIdx].b; im.alt = PRODUCTS[productIdx].name;
        }
        function mod(n, m) { return ((n % m) + m) % m; }
        function frontFace() { return mod(-step, 4); }
        // Görünen yüzün iki yanındaki yüzlere sıradaki ve önceki ürünleri yerleştir
        function prepareNeighbours() {
            var f = frontFace(), cur = slot[f];
            setFace(mod(f + 1, 4), mod(cur + 1, PRODUCTS.length));
            setFace(mod(f - 1, 4), mod(cur - 1, PRODUCTS.length));
        }
        function render(extraDeg) {
            prism.style.transform = 'translateZ(-' + DEPTH + 'px) rotateY(' + (step * 90 + (extraDeg || 0)) + 'deg)';
        }
        function turn(dir) {
            step -= dir;               // dir=1: sonraki ürün sağdan gelir
            render(0);
            setTimeout(prepareNeighbours, 950);
        }

        var timer = null;
        function start() { stop(); timer = setInterval(function () { turn(1); }, AUTO_MS); }
        function stop() { clearInterval(timer); }

        /* Sürükleyerek çevirme */
        var ad = document.getElementById('ad');
        var sx = null, dx = 0, moved = false;
        ad.addEventListener('pointerdown', function (e) {
            sx = e.clientX; dx = 0; moved = false; stop();
            prism.classList.add('nodrag'); ad.classList.add('drag');
            document.getElementById('hint').className = 'hint gone';
        });
        window.addEventListener('pointermove', function (e) {
            if (sx === null) return;
            dx = e.clientX - sx; if (Math.abs(dx) > 5) moved = true;
            render(dx * 0.45);
        });
        window.addEventListener('pointerup', function () {
            if (sx === null) return;
            prism.classList.remove('nodrag'); ad.classList.remove('drag');
            sx = null;
            if (Math.abs(dx) > 40) turn(dx < 0 ? 1 : -1); else render(0);
            setTimeout(start, 4000);
        });
        prism.addEventListener('click', function (e) {
            e.stopPropagation();
            if (!moved) productClick(slot[frontFace()], e);   // dokunma = öndeki ürüne git
        });
        ad.addEventListener('mouseenter', stop);
        ad.addEventListener('mouseleave', function () { if (sx === null) start(); });

        setFace(0, 0); prepareNeighbours(); setFace(2, 2);
        render(0);
        start();
    </script>
</body>
</html>
