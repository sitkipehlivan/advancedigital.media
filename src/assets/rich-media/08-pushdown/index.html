<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.size" content="width=970,height=250">
    <title>Pushdown Video Masthead 970x250 → 970x500</title>
    <!-- NEEDS: ../_ortak/b1.jpg ../_ortak/b2.jpg ../_ortak/b3.jpg ../_ortak/b4.jpg ../_ortak/b5.jpg ../_ortak/b6.jpg ../_ortak/b7.jpg ../_ortak/b8.jpg ../_ortak/b9.jpg -->
    <style>

        /* ===== Marka ayarları: başka markaya uyarlarken sadece burayı değiştirin ===== */
        :root {
            --brand: #f15a22;      /* ana renk */
            --brand2: #e5262b;     /* koyu ton */
            --brand3: #ff8a1e;     /* açık ton */
            --ink: #3b1d12;        /* metin */
            --paper: #ffffff;      /* zemin */
            --soft: #fff4ec;       /* yumuşak zemin */
        }
        @font-face {
            font-family: 'BrandFont';
            src: url('../_ortak/nunito-900.woff2') format('woff2');
            font-weight: 900;
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'BrandFont';
            src: url('../_ortak/nunito-900-ext.woff2') format('woff2');
            font-weight: 900;
            unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { margin: 0; overflow: hidden; background: transparent; }
        body {
            font-family: 'BrandFont', 'Arial Rounded MT Bold', Arial, sans-serif;
            font-weight: 900;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn {
            background: linear-gradient(135deg, var(--brand3) 0%, var(--brand) 55%, var(--brand2) 100%);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 999px;
            font: inherit;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(180, 40, 0, 0.35);
            transition: transform 0.2s ease;
        }
        .btn:hover { transform: scale(1.05); }

        #ad {
            position: relative;
            width: 970px;
            height: 250px;
            overflow: hidden;
            background: linear-gradient(135deg, var(--brand3) 0%, var(--brand) 50%, var(--brand2) 100%);
            cursor: pointer;
            transition: height 0.55s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #ad.open { height: 500px; }

        /* ---------- Kapalı hal (970x250) ---------- */
        #collapsed {
            position: absolute; left: 0; top: 0;
            width: 970px; height: 250px;
            transition: opacity 0.3s ease;
        }
        #ad.open #collapsed { opacity: 0; pointer-events: none; }
        .thumbVideo {
            position: absolute; left: 28px; top: 40px;
            width: 300px; height: 169px;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #fff;
            box-shadow: 0 8px 20px rgba(90, 20, 0, 0.35);
            background: url('../_ortak/poster.jpg') center / cover;
        }
        .thumbVideo video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .play {
            position: absolute; left: 50%; top: 50%;
            width: 56px; height: 56px; margin: -28px 0 0 -28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.95);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.3);
            animation: ring 2s ease-out infinite;
        }
        .play svg { width: 26px; height: 26px; margin-left: 3px; }
        @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.7); } 100% { box-shadow: 0 0 0 18px rgba(255,255,255,0); } }
        .ccopy {
            position: absolute; left: 352px; top: 0;
            width: 250px; height: 250px;
            display: flex; flex-direction: column; justify-content: center; gap: 10px;
            color: #fff;
        }
        .ccopy .kicker { font-size: 12px; letter-spacing: 1.5px; opacity: 0.92; }
        .ccopy h1 { font-size: 30px; line-height: 1.04; font-weight: 900; }
        .ccopy .btn { align-self: flex-start; font-size: 13px; padding: 8px 16px; background: #fff; color: var(--brand2); border-color: #fff; }
        .cprod {
            position: absolute; top: 15px; left: 660px;
            width: 264px; height: 220px;
            transform: rotate(2deg);
            border-radius: 12px; overflow: hidden;
            background: #fff;
            box-shadow: 0 6px 16px rgba(90, 20, 0, 0.3);
        }
        .cprod img { position: absolute; inset: 0; width: 264px; height: 220px; display: block; opacity: 0; transition: opacity 0.5s ease; }
        .cprod img.on { opacity: 1; }

        /* ---------- Açık hal (970x500) ---------- */
        #expanded {
            position: absolute; left: 0; top: 0;
            width: 970px; height: 500px;
            background: var(--soft);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease 0.2s;
        }
        #ad.open #expanded { opacity: 1; pointer-events: auto; }
        .bigVideo {
            position: absolute; left: 24px; top: 24px;
            width: 640px; height: 360px;
            border-radius: 14px; overflow: hidden;
            background: #000;
            box-shadow: 0 10px 26px rgba(90, 20, 0, 0.25);
        }
        .bigVideo video { width: 640px; height: 360px; display: block; object-fit: cover; }
        .ecopy {
            position: absolute; left: 24px; top: 400px;
            width: 640px; height: 76px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .ecopy .kicker { font-size: 12px; letter-spacing: 1.5px; color: var(--brand); }
        .ecopy h2 { font-size: 26px; color: var(--ink); line-height: 1.1; font-weight: 900; }
        .ecopy .btn { font-size: 15px; padding: 10px 22px; }
        .rail {
            position: absolute; left: 688px; top: 24px;
            width: 258px; height: 452px;
            overflow: hidden;
            border-radius: 14px;
        }
        .railTrack { display: flex; flex-direction: column; gap: 12px; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .railItem { flex: 0 0 215px; height: 215px; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 4px 12px rgba(90, 20, 0, 0.14); }
        .railItem img { width: 258px; height: 215px; display: block; }
        .close {
            position: absolute; right: 16px; top: 10px;
            height: 30px; padding: 0 12px;
            border-radius: 999px;
            background: rgba(0,0,0,0.6); color: #fff;
            border: 2px solid #fff;
            font: 900 12px Arial, sans-serif;
            cursor: pointer;
            z-index: 10;
            display: none;
        }
        #ad.open .close { display: block; }
    </style>
    <script type="text/javascript">

        /* ===== ClickTag tanımları: her ürün kendi clickTag'ine gider ===== */
        var clickTag  = "https://www.civilim.com";
        var clickTag1 = "https://www.civilim.com";
        var clickTag2 = "https://www.civilim.com";
        var clickTag3 = "https://www.civilim.com";
        var clickTag4 = "https://www.civilim.com";
        var clickTag5 = "https://www.civilim.com";
        var clickTag6 = "https://www.civilim.com";
        var clickTag7 = "https://www.civilim.com";
        var clickTag8 = "https://www.civilim.com";
        var clickTag9 = "https://www.civilim.com";

        /* ===== Ürün listesi: b = 300x250 banner, w = 970x250 banner ===== */
        var PRODUCTS = [
            { name: "Molfix Bebek Bezi",            short: "Bebek Bezi",  price: "250 TL",       b: "../_ortak/b1.jpg", w: "w1.jpg" },
            { name: "Konuşan Bebek & Araba",        short: "Oyuncak",     price: "550 TL'den",   b: "../_ortak/b2.jpg", w: "w2.jpg" },
            { name: "Panduf & Eşofman Takımı",      short: "Panduf",      price: "150 TL'den",   b: "../_ortak/b3.jpg", w: "w3.jpg" },
            { name: "Philips Avent Emzik & Biberon",short: "Emzik",       price: "400 TL'den",   b: "../_ortak/b4.jpg", w: "w4.jpg" },
            { name: "Eşofman & Spor Ayakkabı",      short: "Eşofman",     price: "650 TL'den",   b: "../_ortak/b5.jpg", w: "w5.jpg" },
            { name: "Oyun Parkı & Bebek Arabası",   short: "Oyun Parkı",  price: "4.900 TL'den", b: "../_ortak/b6.jpg", w: "w6.jpg" },
            { name: "Oto Koltuğu & Bebek Arabası",  short: "Oto Koltuğu", price: "9.990 TL'den", b: "../_ortak/b7.jpg", w: "w7.jpg" },
            { name: "Pijama & Panduf",              short: "Pijama",      price: "390 TL",       b: "../_ortak/b8.jpg", w: "w8.jpg" },
            { name: "Zıbın Seti & Bakım Çantası",   short: "Zıbın Seti",  price: "790 TL",       b: "../_ortak/b9.jpg", w: "w9.jpg" }
        ];

        function exitClick(e) {
            if (e) e.stopPropagation();
            window.open(clickTag, '_blank');
        }
        function productClick(i, e) {
            if (e) e.stopPropagation();
            window.open(window['clickTag' + (i + 1)] || clickTag, '_blank');
        }

    </script>
</head>
<body>
    <div id="ad" onclick="exitClick(event)">

        <div id="collapsed">
            <div class="thumbVideo" id="openBtn">
                <video id="teaser" muted playsinline autoplay loop preload="auto" poster="../_ortak/poster.jpg">
                    <source src="../_ortak/video.mp4" type="video/mp4">
                </video>
                <div class="play"><svg viewBox="0 0 24 24"><path fill="#e5262b" d="M8 5v14l11-7z"/></svg></div>
            </div>
            <div class="ccopy">
                <div class="kicker">30. YIL FIRSATLARI</div>
                <h1>Filmi izle,<br>fırsatları gör</h1>
                <button class="btn" id="openBtn2">Genişlet ve İzle ▾</button>
            </div>
            <div class="cprod" id="cprod"></div>
        </div>

        <div id="expanded">
            <div class="bigVideo">
                <video id="big" playsinline controls preload="none" poster="../_ortak/poster.jpg">
                    <source src="../_ortak/video.mp4" type="video/mp4">
                </video>
            </div>
            <div class="ecopy">
                <div>
                    <div class="kicker">02–15 KASIM</div>
                    <h2>Civil 30. Yıl'a özel fiyatlar</h2>
                </div>
                <button class="btn" onclick="exitClick(event)">Alışverişe Başla ›</button>
            </div>
            <div class="rail"><div class="railTrack" id="railTrack"></div></div>
        </div>

        <button class="close" id="close">KAPAT ✕</button>
    </div>

    <script type="text/javascript">
        var EXPANDED_H = 500;
        var ad = document.getElementById('ad');
        var big = document.getElementById('big');
        var teaser = document.getElementById('teaser');
        var railTrack = document.getElementById('railTrack');
        var railPos = 0, railTimer = null;

        PRODUCTS.forEach(function (p, i) {
            var d = document.createElement('div');
            d.className = 'railItem';
            d.innerHTML = '<img src="' + p.b + '" alt="' + p.name + '">';
            d.addEventListener('click', function (e) { productClick(i, e); });
            railTrack.appendChild(d);
        });
        /* Kapalı haldeki ürün vitrini */
        var cprod = document.getElementById('cprod'), cIdx = 0;
        PRODUCTS.forEach(function (p, i) {
            var im = document.createElement('img');
            im.src = p.b; im.alt = p.name; if (i === 0) im.className = 'on';
            cprod.appendChild(im);
        });
        setInterval(function () {
            var ims = cprod.children;
            ims[cIdx].className = '';
            cIdx = (cIdx + 1) % ims.length;
            ims[cIdx].className = 'on';
        }, 2400);
        cprod.addEventListener('click', function (e) { productClick(cIdx, e); });

        function railNext() {
            railPos = (railPos + 1) % (PRODUCTS.length - 1);
            railTrack.style.transform = 'translateY(' + (-railPos * 227) + 'px)';
        }

        /* Yayıncı/ad server'a boyut değişimini bildir (gerçek pushdown'da yayıncının expand API'si kullanılır) */
        function notify(h) {
            try { window.parent.postMessage({ type: 'ad-resize', height: h }, '*'); } catch (err) {}
        }

        function expand(e) {
            if (e) e.stopPropagation();
            ad.className = 'open';
            notify(EXPANDED_H);
            teaser.pause();
            big.currentTime = 0;
            big.muted = false;           // Kullanıcı tıkladığı için sesli oynatılabilir
            var p = big.play();
            if (p && p.catch) p.catch(function () { big.muted = true; big.play(); });
            clearInterval(railTimer);
            railTimer = setInterval(railNext, 2600);
        }
        function collapse(e) {
            if (e) e.stopPropagation();
            ad.className = '';
            big.pause();
            teaser.play();
            clearInterval(railTimer);
            setTimeout(function () { notify(250); }, 550);
        }
        document.getElementById('openBtn').addEventListener('click', expand);
        document.getElementById('openBtn2').addEventListener('click', expand);
        document.getElementById('close').addEventListener('click', collapse);
        document.querySelector('.bigVideo').addEventListener('click', function (e) { e.stopPropagation(); });
    </script>
</body>
</html>
