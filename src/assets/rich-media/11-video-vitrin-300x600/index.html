<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.size" content="width=300,height=600">
    <title>Video + Vitrin 300x600</title>
    <!-- NEEDS: ../_ortak/b1.jpg ../_ortak/b2.jpg ../_ortak/b3.jpg ../_ortak/b4.jpg ../_ortak/b5.jpg ../_ortak/b6.jpg ../_ortak/b7.jpg ../_ortak/b8.jpg ../_ortak/b9.jpg -->
    <style>

        /* ===== Marka ayarları: başka markaya uyarlarken sadece burayı değiştirin ===== */
        :root {
            --brand: #f15a22;      /* ana renk */
            --brand2: #e5262b;     /* koyu ton */
            --brand3: #ff8a1e;     /* açık ton */
            --ink: #3b1d12;        /* metin */
            --paper: #ffffff;      /* zemin */
            --soft: #fff4ec;       /* yumuşak zemin */
        }
        @font-face {
            font-family: 'BrandFont';
            src: url('../_ortak/nunito-900.woff2') format('woff2');
            font-weight: 900;
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'BrandFont';
            src: url('../_ortak/nunito-900-ext.woff2') format('woff2');
            font-weight: 900;
            unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { margin: 0; overflow: hidden; background: transparent; }
        body {
            font-family: 'BrandFont', 'Arial Rounded MT Bold', Arial, sans-serif;
            font-weight: 900;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn {
            background: linear-gradient(135deg, var(--brand3) 0%, var(--brand) 55%, var(--brand2) 100%);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 999px;
            font: inherit;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(180, 40, 0, 0.35);
            transition: transform 0.2s ease;
        }
        .btn:hover { transform: scale(1.05); }

        #ad { position: relative; width: 300px; height: 600px; overflow: hidden; cursor: pointer;
            background: linear-gradient(180deg, var(--brand3) 0%, var(--brand) 40%, var(--brand2) 100%); color: #fff; }
        .head { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; }
        .head .k { font-size: 10px; letter-spacing: 1.5px; opacity: 0.9; }
        .head .h { font-size: 22px; line-height: 1.05; }
        .video { position: absolute; left: 0; top: 64px; width: 300px; height: 169px; background: #000; }
        .video video { width: 300px; height: 169px; display: block; object-fit: cover; }
        .sound { position: absolute; right: 8px; bottom: 8px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0,0,0,0.55); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .sound svg { width: 16px; height: 16px; }
        .stage { position: absolute; left: 0; top: 241px; width: 300px; height: 250px; overflow: hidden; background: #fff; }
        .stage img { position: absolute; inset: 0; width: 300px; height: 250px; opacity: 0; transform: translateX(30px); transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .stage img.on { opacity: 1; transform: none; }
        .dots { position: absolute; left: 0; right: 0; top: 498px; display: flex; justify-content: center; gap: 6px; }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.45); transition: transform 0.2s, background 0.2s; }
        .dot.on { background: #fff; transform: scale(1.3); }
        .foot { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .foot small { font-size: 11px; letter-spacing: 1px; opacity: 0.95; }
        .foot .btn { font-size: 15px; padding: 9px 26px; background: #fff; color: var(--brand2); border-color: #fff; }
    </style>
    <script type="text/javascript">

        /* ===== ClickTag tanımları: her ürün kendi clickTag'ine gider ===== */
        var clickTag  = "https://www.civilim.com";
        var clickTag1 = "https://www.civilim.com";
        var clickTag2 = "https://www.civilim.com";
        var clickTag3 = "https://www.civilim.com";
        var clickTag4 = "https://www.civilim.com";
        var clickTag5 = "https://www.civilim.com";
        var clickTag6 = "https://www.civilim.com";
        var clickTag7 = "https://www.civilim.com";
        var clickTag8 = "https://www.civilim.com";
        var clickTag9 = "https://www.civilim.com";

        /* ===== Ürün listesi: b = 300x250 banner, w = 970x250 banner ===== */
        var PRODUCTS = [
            { name: "Molfix Bebek Bezi",            short: "Bebek Bezi",  price: "250 TL",       b: "../_ortak/b1.jpg", w: "w1.jpg" },
            { name: "Konuşan Bebek & Araba",        short: "Oyuncak",     price: "550 TL'den",   b: "../_ortak/b2.jpg", w: "w2.jpg" },
            { name: "Panduf & Eşofman Takımı",      short: "Panduf",      price: "150 TL'den",   b: "../_ortak/b3.jpg", w: "w3.jpg" },
            { name: "Philips Avent Emzik & Biberon",short: "Emzik",       price: "400 TL'den",   b: "../_ortak/b4.jpg", w: "w4.jpg" },
            { name: "Eşofman & Spor Ayakkabı",      short: "Eşofman",     price: "650 TL'den",   b: "../_ortak/b5.jpg", w: "w5.jpg" },
            { name: "Oyun Parkı & Bebek Arabası",   short: "Oyun Parkı",  price: "4.900 TL'den", b: "../_ortak/b6.jpg", w: "w6.jpg" },
            { name: "Oto Koltuğu & Bebek Arabası",  short: "Oto Koltuğu", price: "9.990 TL'den", b: "../_ortak/b7.jpg", w: "w7.jpg" },
            { name: "Pijama & Panduf",              short: "Pijama",      price: "390 TL",       b: "../_ortak/b8.jpg", w: "w8.jpg" },
            { name: "Zıbın Seti & Bakım Çantası",   short: "Zıbın Seti",  price: "790 TL",       b: "../_ortak/b9.jpg", w: "w9.jpg" }
        ];

        function exitClick(e) {
            if (e) e.stopPropagation();
            window.open(clickTag, '_blank');
        }
        function productClick(i, e) {
            if (e) e.stopPropagation();
            window.open(window['clickTag' + (i + 1)] || clickTag, '_blank');
        }

    </script>
</head>
<body>
    <div id="ad" onclick="exitClick(event)">
        <div class="head"><div class="k">CİVİL 30. YIL</div><div class="h">Fırsatlar başladı!</div></div>
        <div class="video">
            <video id="video" muted playsinline autoplay loop preload="auto" poster="../_ortak/poster.jpg"><source src="../_ortak/video.mp4" type="video/mp4"></video>
            <button class="sound" id="sound" aria-label="Sesi aç"><svg viewBox="0 0 24 24"><path fill="#fff" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM12 4L9.91 6.09 12 8.18V4zm-7.91-.09L2.81 5.18 6.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.03c1.38-.31 2.63-.95 3.69-1.81l2.38 2.38 1.41-1.41L4.09 3.91z"/></svg></button>
        </div>
        <div class="stage" id="stage"></div>
        <div class="dots" id="dots"></div>
        <div class="foot"><small>02–15 KASIM</small><button class="btn" onclick="exitClick(event)">Hemen Keşfet ›</button></div>
    </div>
    <script type="text/javascript">
        var AUTO_MS = 2500;
        var stage = document.getElementById('stage'), dots = document.getElementById('dots'), cur = 0, timer;
        PRODUCTS.forEach(function (p, i) {
            var im = document.createElement('img'); im.src = p.b; im.alt = p.name; stage.appendChild(im);
            var d = document.createElement('div'); d.className = 'dot'; dots.appendChild(d);
        });
        function show(i) {
            cur = i;
            var ims = stage.children, ds = dots.children;
            for (var k = 0; k < ims.length; k++) { ims[k].className = k === i ? 'on' : ''; ds[k].className = 'dot' + (k === i ? ' on' : ''); }
        }
        function start() { clearInterval(timer); timer = setInterval(function () { show((cur + 1) % PRODUCTS.length); }, AUTO_MS); }
        stage.addEventListener('click', function (e) { productClick(cur, e); });
        stage.addEventListener('mouseenter', function () { clearInterval(timer); });
        stage.addEventListener('mouseleave', start);
        var video = document.getElementById('video');
        document.getElementById('sound').addEventListener('click', function (e) { e.stopPropagation(); video.muted = !video.muted; this.style.opacity = video.muted ? 1 : 0.5; });
        var p = video.play(); if (p && p.catch) p.catch(function () {});
        show(0); start();
    </script>
</body>
</html>
