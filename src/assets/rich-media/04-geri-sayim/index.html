<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.size" content="width=970,height=250">
    <title>Geri Sayım Masthead 970x250</title>
    <!-- NEEDS: ../_ortak/b1.jpg ../_ortak/b2.jpg ../_ortak/b3.jpg ../_ortak/b4.jpg ../_ortak/b5.jpg ../_ortak/b6.jpg ../_ortak/b7.jpg ../_ortak/b8.jpg ../_ortak/b9.jpg -->
    <style>

        /* ===== Marka ayarları: başka markaya uyarlarken sadece burayı değiştirin ===== */
        :root {
            --brand: #f15a22;      /* ana renk */
            --brand2: #e5262b;     /* koyu ton */
            --brand3: #ff8a1e;     /* açık ton */
            --ink: #3b1d12;        /* metin */
            --paper: #ffffff;      /* zemin */
            --soft: #fff4ec;       /* yumuşak zemin */
        }
        @font-face {
            font-family: 'BrandFont';
            src: url('../_ortak/nunito-900.woff2') format('woff2');
            font-weight: 900;
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'BrandFont';
            src: url('../_ortak/nunito-900-ext.woff2') format('woff2');
            font-weight: 900;
            unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { margin: 0; overflow: hidden; background: transparent; }
        body {
            font-family: 'BrandFont', 'Arial Rounded MT Bold', Arial, sans-serif;
            font-weight: 900;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn {
            background: linear-gradient(135deg, var(--brand3) 0%, var(--brand) 55%, var(--brand2) 100%);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 999px;
            font: inherit;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(180, 40, 0, 0.35);
            transition: transform 0.2s ease;
        }
        .btn:hover { transform: scale(1.05); }

        #ad {
            position: relative;
            width: 970px;
            height: 250px;
            overflow: hidden;
            background: var(--paper);
            cursor: pointer;
        }

        /* Sol: geri sayım bloğu */
        .count {
            position: absolute;
            left: 0; top: 0;
            width: 340px; height: 250px;
            padding: 22px 26px;
            display: flex; flex-direction: column; justify-content: center; gap: 12px;
            color: #fff;
            background: linear-gradient(150deg, var(--brand3) 0%, var(--brand) 50%, var(--brand2) 100%);
        }
        .count .kicker { font-size: 12px; letter-spacing: 1.5px; opacity: 0.92; }
        .count .title { font-size: 25px; line-height: 1.05; }
        .boxes { display: flex; gap: 8px; }
        .box {
            width: 64px;
            padding: 7px 0 6px;
            border-radius: 10px;
            background: #fff;
            color: var(--brand2);
            text-align: center;
            box-shadow: 0 4px 10px rgba(120, 20, 0, 0.25);
        }
        .box b { display: block; font-size: 27px; line-height: 1; font-variant-numeric: tabular-nums; }
        .box small { display: block; font-size: 9px; letter-spacing: 1px; color: var(--ink); opacity: 0.6; margin-top: 3px; }
        .box.sec b { animation: tick 1s ease-out infinite; }
        @keyframes tick { 0% { transform: scale(1.12); } 40% { transform: scale(1); } }
        .count .btn {
            align-self: flex-start;
            font-size: 13px; padding: 7px 16px;
            background: #fff; color: var(--brand2); border-color: #fff;
        }

        /* Orta: döner ürün vitrini */
        .stage {
            position: absolute;
            left: 352px; top: 0;
            width: 300px; height: 250px;
            overflow: hidden;
        }
        .stage img {
            position: absolute; inset: 0;
            width: 300px; height: 250px;
            opacity: 0;
            transform: scale(1.04);
            transition: opacity 0.6s ease, transform 3s ease;
        }
        .stage img.on { opacity: 1; transform: scale(1); }
        .progress {
            position: absolute; left: 0; bottom: 0;
            height: 4px; width: 0;
            background: var(--brand2);
            z-index: 3;
        }
        .progress.run { width: 100%; transition: width linear; }

        /* Sağ: ürün ızgarası */
        .grid {
            position: absolute;
            left: 664px; top: 7px;
            display: grid;
            grid-template-columns: repeat(3, 92px);
            grid-auto-rows: 76px;
            gap: 4px;
        }
        .thumb {
            width: 92px; height: 76px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid transparent;
            opacity: 0.55;
            transition: opacity 0.25s, border-color 0.25s, transform 0.25s;
        }
        .thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
        .thumb.on, .thumb:hover { opacity: 1; border-color: var(--brand); transform: scale(1.04); }
    </style>
    <script type="text/javascript">

        /* ===== ClickTag tanımları: her ürün kendi clickTag'ine gider ===== */
        var clickTag  = "https://www.civilim.com";
        var clickTag1 = "https://www.civilim.com";
        var clickTag2 = "https://www.civilim.com";
        var clickTag3 = "https://www.civilim.com";
        var clickTag4 = "https://www.civilim.com";
        var clickTag5 = "https://www.civilim.com";
        var clickTag6 = "https://www.civilim.com";
        var clickTag7 = "https://www.civilim.com";
        var clickTag8 = "https://www.civilim.com";
        var clickTag9 = "https://www.civilim.com";

        /* ===== Ürün listesi: b = 300x250 banner, w = 970x250 banner ===== */
        var PRODUCTS = [
            { name: "Molfix Bebek Bezi",            short: "Bebek Bezi",  price: "250 TL",       b: "../_ortak/b1.jpg", w: "w1.jpg" },
            { name: "Konuşan Bebek & Araba",        short: "Oyuncak",     price: "550 TL'den",   b: "../_ortak/b2.jpg", w: "w2.jpg" },
            { name: "Panduf & Eşofman Takımı",      short: "Panduf",      price: "150 TL'den",   b: "../_ortak/b3.jpg", w: "w3.jpg" },
            { name: "Philips Avent Emzik & Biberon",short: "Emzik",       price: "400 TL'den",   b: "../_ortak/b4.jpg", w: "w4.jpg" },
            { name: "Eşofman & Spor Ayakkabı",      short: "Eşofman",     price: "650 TL'den",   b: "../_ortak/b5.jpg", w: "w5.jpg" },
            { name: "Oyun Parkı & Bebek Arabası",   short: "Oyun Parkı",  price: "4.900 TL'den", b: "../_ortak/b6.jpg", w: "w6.jpg" },
            { name: "Oto Koltuğu & Bebek Arabası",  short: "Oto Koltuğu", price: "9.990 TL'den", b: "../_ortak/b7.jpg", w: "w7.jpg" },
            { name: "Pijama & Panduf",              short: "Pijama",      price: "390 TL",       b: "../_ortak/b8.jpg", w: "w8.jpg" },
            { name: "Zıbın Seti & Bakım Çantası",   short: "Zıbın Seti",  price: "790 TL",       b: "../_ortak/b9.jpg", w: "w9.jpg" }
        ];

        function exitClick(e) {
            if (e) e.stopPropagation();
            window.open(clickTag, '_blank');
        }
        function productClick(i, e) {
            if (e) e.stopPropagation();
            window.open(window['clickTag' + (i + 1)] || clickTag, '_blank');
        }

    </script>
</head>
<body>
    <div id="ad" onclick="exitClick(event)">
        <div class="count">
            <div class="kicker">KAMPANYANIN BİTMESİNE</div>
            <div class="boxes">
                <div class="box"><b id="d">00</b><small>GÜN</small></div>
                <div class="box"><b id="h">00</b><small>SAAT</small></div>
                <div class="box"><b id="m">00</b><small>DAKİKA</small></div>
                <div class="box sec"><b id="s">00</b><small>SANİYE</small></div>
            </div>
            <div class="title" id="title">02–15 Kasım<br>30. Yıl Fırsatları</div>
            <button class="btn" onclick="exitClick(event)">Tüm Fırsatlar ›</button>
        </div>

        <div class="stage" id="stage"><div class="progress" id="progress"></div></div>
        <div class="grid" id="grid"></div>
    </div>

    <script type="text/javascript">
        var CAMPAIGN_END = '2026-11-15T23:59:59+03:00';   // Kampanya bitiş zamanı
        var AUTO_MS = 2600;                               // Vitrin geçiş süresi

        /* --- Geri sayım --- */
        var end = new Date(CAMPAIGN_END).getTime();
        function pad(n) { return (n < 10 ? '0' : '') + n; }
        function tick() {
            var t = Math.max(0, end - Date.now());
            var s = Math.floor(t / 1000);
            document.getElementById('d').textContent = pad(Math.floor(s / 86400));
            document.getElementById('h').textContent = pad(Math.floor(s % 86400 / 3600));
            document.getElementById('m').textContent = pad(Math.floor(s % 3600 / 60));
            document.getElementById('s').textContent = pad(s % 60);
            if (t === 0) document.getElementById('title').innerHTML = 'Kampanya<br>sona erdi';
        }
        tick();
        setInterval(tick, 1000);

        /* --- Vitrin + ızgara --- */
        var stage = document.getElementById('stage');
        var grid = document.getElementById('grid');
        var progress = document.getElementById('progress');
        var current = 0, timer = null, resumeTimer = null;

        PRODUCTS.forEach(function (p, i) {
            var img = document.createElement('img');
            img.src = p.b; img.alt = p.name;
            stage.insertBefore(img, progress);

            var t = document.createElement('div');
            t.className = 'thumb';
            t.innerHTML = '<img src="' + p.b + '" alt="">';
            t.addEventListener('mouseenter', function () { show(i); stop(); });
            t.addEventListener('mouseleave', resumeLater);
            t.addEventListener('click', function (e) { productClick(i, e); });
            grid.appendChild(t);
        });
        stage.addEventListener('click', function (e) { productClick(current, e); });

        function show(i) {
            current = i;
            var imgs = stage.querySelectorAll('img'), thumbs = grid.children;
            for (var k = 0; k < imgs.length; k++) {
                imgs[k].className = k === i ? 'on' : '';
                thumbs[k].className = 'thumb' + (k === i ? ' on' : '');
            }
        }
        function runBar() {
            progress.className = 'progress';
            progress.style.transitionDuration = '0ms';
            progress.offsetWidth;
            progress.style.transitionDuration = AUTO_MS + 'ms';
            progress.className = 'progress run';
        }
        function start() {
            stop();
            runBar();
            timer = setInterval(function () { show((current + 1) % PRODUCTS.length); runBar(); }, AUTO_MS);
        }
        function stop() { clearInterval(timer); timer = null; progress.className = 'progress'; }
        function resumeLater() { clearTimeout(resumeTimer); resumeTimer = setTimeout(start, 3000); }
        stage.addEventListener('mouseenter', stop);
        stage.addEventListener('mouseleave', resumeLater);

        show(0);
        start();
    </script>
</body>
</html>
