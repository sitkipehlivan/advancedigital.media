<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.size" content="width=970,height=250">
    <title>Shoppable Video Masthead 970x250</title>
    <!-- NEEDS: ../_ortak/b5.jpg ../_ortak/b3.jpg ../_ortak/b8.jpg ../_ortak/b9.jpg -->
    <style>

        /* ===== Marka ayarları: başka markaya uyarlarken sadece burayı değiştirin ===== */
        :root {
            --brand: #f15a22;      /* ana renk */
            --brand2: #e5262b;     /* koyu ton */
            --brand3: #ff8a1e;     /* açık ton */
            --ink: #3b1d12;        /* metin */
            --paper: #ffffff;      /* zemin */
            --soft: #fff4ec;       /* yumuşak zemin */
        }
        @font-face {
            font-family: 'BrandFont';
            src: url('../_ortak/nunito-900.woff2') format('woff2');
            font-weight: 900;
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'BrandFont';
            src: url('../_ortak/nunito-900-ext.woff2') format('woff2');
            font-weight: 900;
            unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { margin: 0; overflow: hidden; background: transparent; }
        body {
            font-family: 'BrandFont', 'Arial Rounded MT Bold', Arial, sans-serif;
            font-weight: 900;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn {
            background: linear-gradient(135deg, var(--brand3) 0%, var(--brand) 55%, var(--brand2) 100%);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 999px;
            font: inherit;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(180, 40, 0, 0.35);
            transition: transform 0.2s ease;
        }
        .btn:hover { transform: scale(1.05); }

        #ad {
            position: relative;
            width: 970px;
            height: 250px;
            overflow: hidden;
            background: var(--soft);
            cursor: pointer;
        }

        .video {
            position: absolute; left: 0; top: 0;
            width: 444px; height: 250px;
            background: #000;
        }
        .video video { width: 444px; height: 250px; display: block; object-fit: cover; }
        .scrub {
            position: absolute; left: 12px; right: 56px; bottom: 16px;
            height: 4px; border-radius: 2px;
            background: rgba(255,255,255,0.35);
        }
        .scrub i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; background: #fff; }
        .scrub .mark {
            position: absolute; top: 50%;
            width: 12px; height: 12px; margin: -6px 0 0 -6px;
            border-radius: 50%;
            background: var(--brand);
            border: 2px solid #fff;
        }
        .sound {
            position: absolute; right: 12px; bottom: 6px;
            width: 30px; height: 30px; border-radius: 50%;
            background: rgba(0,0,0,0.55); border: 0; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .sound svg { width: 17px; height: 17px; }
        .live {
            position: absolute; left: 12px; top: 12px;
            background: var(--brand2); color: #fff;
            font-size: 10px; letter-spacing: 1px;
            padding: 4px 9px; border-radius: 999px;
        }

        /* Ürün kartı */
        .label {
            position: absolute; left: 462px; top: 9px;
            font-size: 11px; letter-spacing: 1.2px; color: var(--brand);
        }
        .card {
            position: absolute;
            left: 462px; top: 28px;
            width: 252px; height: 210px;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 6px 18px rgba(90, 20, 0, 0.18);
        }
        .card img { position: absolute; inset: 0; width: 252px; height: 210px; display: block; }
        .card.pop { animation: pop 0.5s cubic-bezier(0.3, 1.4, 0.5, 1); }
        @keyframes pop { 0% { transform: scale(0.9); opacity: 0.4; } 100% { transform: scale(1); opacity: 1; } }
        .card .intro {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
            text-align: center; padding: 20px;
            color: var(--ink);
            background: linear-gradient(160deg, #fff 0%, var(--soft) 100%);
        }
        .card .intro b { font-size: 20px; color: var(--brand2); line-height: 1.1; }
        .card .intro span { font-size: 12px; opacity: 0.7; }
        .card .mini { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: #fff; }
        .card .mini img { position: static; width: 100%; height: 100%; border-radius: 6px; object-fit: cover; }

        /* Videodaki ürünler listesi */
        .chips {
            position: absolute;
            left: 728px; top: 12px;
            width: 230px;
            display: flex; flex-direction: column; gap: 6px;
        }
        .chip {
            display: flex; align-items: center; gap: 9px;
            height: 52px;
            padding: 0 10px 0 6px;
            border-radius: 10px;
            background: #fff;
            border: 2px solid transparent;
            color: var(--ink);
            transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
        }
        .chip .t {
            flex: 0 0 38px; height: 38px;
            border-radius: 8px;
            background: var(--soft);
            color: var(--brand);
            font-size: 11px;
            display: flex; align-items: center; justify-content: center;
            font-variant-numeric: tabular-nums;
        }
        .chip .n { font-size: 13px; line-height: 1.15; flex: 1; }
        .chip .p { font-size: 13px; color: var(--brand2); white-space: nowrap; }
        .chip.on { border-color: var(--brand); transform: translateX(-4px); box-shadow: 0 4px 12px rgba(241, 90, 34, 0.22); }
        .chip.on .t { background: var(--brand); color: #fff; }
    </style>
    <script type="text/javascript">

        /* ===== ClickTag tanımları: her ürün kendi clickTag'ine gider ===== */
        var clickTag  = "https://www.civilim.com";
        var clickTag1 = "https://www.civilim.com";
        var clickTag2 = "https://www.civilim.com";
        var clickTag3 = "https://www.civilim.com";
        var clickTag4 = "https://www.civilim.com";
        var clickTag5 = "https://www.civilim.com";
        var clickTag6 = "https://www.civilim.com";
        var clickTag7 = "https://www.civilim.com";
        var clickTag8 = "https://www.civilim.com";
        var clickTag9 = "https://www.civilim.com";

        /* ===== Ürün listesi: b = 300x250 banner, w = 970x250 banner ===== */
        var PRODUCTS = [
            { name: "Molfix Bebek Bezi",            short: "Bebek Bezi",  price: "250 TL",       b: "b1.jpg", w: "w1.jpg" },
            { name: "Konuşan Bebek & Araba",        short: "Oyuncak",     price: "550 TL'den",   b: "b2.jpg", w: "w2.jpg" },
            { name: "Panduf & Eşofman Takımı",      short: "Panduf",      price: "150 TL'den",   b: "../_ortak/b3.jpg", w: "w3.jpg" },
            { name: "Philips Avent Emzik & Biberon",short: "Emzik",       price: "400 TL'den",   b: "b4.jpg", w: "w4.jpg" },
            { name: "Eşofman & Spor Ayakkabı",      short: "Eşofman",     price: "650 TL'den",   b: "../_ortak/b5.jpg", w: "w5.jpg" },
            { name: "Oyun Parkı & Bebek Arabası",   short: "Oyun Parkı",  price: "4.900 TL'den", b: "b6.jpg", w: "w6.jpg" },
            { name: "Oto Koltuğu & Bebek Arabası",  short: "Oto Koltuğu", price: "9.990 TL'den", b: "b7.jpg", w: "w7.jpg" },
            { name: "Pijama & Panduf",              short: "Pijama",      price: "390 TL",       b: "../_ortak/b8.jpg", w: "w8.jpg" },
            { name: "Zıbın Seti & Bakım Çantası",   short: "Zıbın Seti",  price: "790 TL",       b: "../_ortak/b9.jpg", w: "w9.jpg" }
        ];

        function exitClick(e) {
            if (e) e.stopPropagation();
            window.open(clickTag, '_blank');
        }
        function productClick(i, e) {
            if (e) e.stopPropagation();
            window.open(window['clickTag' + (i + 1)] || clickTag, '_blank');
        }

    </script>
</head>
<body>
    <div id="ad" onclick="exitClick(event)">
        <div class="video">
            <video id="video" muted playsinline autoplay loop preload="auto" poster="../_ortak/poster.jpg">
                <source src="../_ortak/video.mp4" type="video/mp4">
            </video>
            <div class="live">VİDEODAKİ ÜRÜNLERİ KEŞFET</div>
            <div class="scrub" id="scrub"><i id="played"></i></div>
            <button class="sound" id="sound" aria-label="Sesi aç">
                <svg viewBox="0 0 24 24"><path fill="#fff" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM12 4L9.91 6.09 12 8.18V4zm-7.91-.09L2.81 5.18 6.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.03c1.38-.31 2.63-.95 3.69-1.81l2.38 2.38 1.41-1.41L4.09 3.91z"/></svg>
            </button>
        </div>

        <div class="label" id="label">ŞU AN VİDEODA</div>
        <div class="card" id="card"></div>
        <div class="chips" id="chips"></div>
    </div>

    <script type="text/javascript">
        /* Videodaki zaman kodları. p = PRODUCTS dizisindeki sıra (0'dan başlar), null = marka kartı.
           kind: 'intro' = açılış kartı, 'more' = diğer ürünler ızgarası */
        var TIMELINE = [
            { t: 0,   kind: 'intro', title: 'Civil 30. Yıl',      price: '' },
            { t: 2.6, p: 4,          title: 'Çocuk Eşofman Takımı', price: '650 TL' },
            { t: 5.2, p: 4,          title: 'Spor Ayakkabı',       price: '750 TL' },
            { t: 8.6, kind: 'more',  title: 'Diğer fırsatlar',      price: '390 TL\'den' }
        ];
        var MORE = [2, 7, 8, 4];   // "Diğer fırsatlar" ızgarasında gösterilecek ürünler

        var video = document.getElementById('video');
        var card = document.getElementById('card');
        var chipsEl = document.getElementById('chips');
        var active = -1;

        function fmt(t) { return '0:' + (t < 10 ? '0' : '') + Math.floor(t); }

        TIMELINE.forEach(function (it, i) {
            var c = document.createElement('div');
            c.className = 'chip';
            c.innerHTML = '<div class="t">' + fmt(it.t) + '</div><div class="n">' + it.title + '</div><div class="p">' + it.price + '</div>';
            c.addEventListener('click', function (e) {
                e.stopPropagation();
                video.currentTime = it.t + 0.05;   // Ürüne tıklayınca video o ana atlar
                video.play();
                setActive(i);
            });
            chipsEl.appendChild(c);
        });

        function setActive(i) {
            if (i === active) return;
            active = i;
            var it = TIMELINE[i];
            var html;
            if (it.kind === 'intro') {
                html = '<div class="intro"><b>Videodaki ürünler<br>burada belirecek</b><span>Ürüne tıkla, videoda o sahneye git</span></div>';
                document.getElementById('label').textContent = 'VİDEODAKİ ÜRÜNLER';
            } else if (it.kind === 'more') {
                html = '<div class="mini">' + MORE.map(function (k) { return '<img src="' + PRODUCTS[k].b + '" data-k="' + k + '" alt="">'; }).join('') + '</div>';
                document.getElementById('label').textContent = 'DİĞER FIRSATLAR';
            } else {
                html = '<img src="' + PRODUCTS[it.p].b + '" alt="' + PRODUCTS[it.p].name + '">';
                document.getElementById('label').textContent = 'ŞU AN VİDEODA';
            }
            card.innerHTML = html;
            card.className = 'card';
            card.offsetWidth;
            card.className = 'card pop';
            var chips = chipsEl.children;
            for (var k = 0; k < chips.length; k++) chips[k].className = 'chip' + (k === i ? ' on' : '');
        }

        card.addEventListener('click', function (e) {
            var it = TIMELINE[active];
            if (!it) return;
            if (it.kind === 'more' && e.target.getAttribute('data-k')) productClick(+e.target.getAttribute('data-k'), e);
            else if (typeof it.p === 'number') productClick(it.p, e);
            // intro kartı: genel clickTag'e gider (tıklama #ad'e geçer)
        });

        video.addEventListener('timeupdate', function () {
            var t = video.currentTime, idx = 0;
            for (var i = 0; i < TIMELINE.length; i++) if (t >= TIMELINE[i].t) idx = i;
            setActive(idx);
            if (video.duration) document.getElementById('played').style.width = (t / video.duration * 100) + '%';
        });
        function addMarks() {
            var scrub = document.getElementById('scrub');
            TIMELINE.forEach(function (it) {
                if (it.kind === 'intro') return;
                var m = document.createElement('div');
                m.className = 'mark';
                m.style.left = (it.t / video.duration * 100) + '%';
                scrub.appendChild(m);
            });
        }
        if (video.readyState >= 1) addMarks(); else video.addEventListener('loadedmetadata', addMarks);
        document.getElementById('sound').addEventListener('click', function (e) {
            e.stopPropagation();
            video.muted = !video.muted;
            this.style.opacity = video.muted ? 1 : 0.5;
        });

        setActive(0);
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
    </script>
</body>
</html>
